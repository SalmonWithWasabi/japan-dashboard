name: Refresh dashboard

on:
  schedule:
    - cron: "17 1 * * *"   # every day 01:17 UTC = 10:17 Tokyo (after MOF's 9:30 JST release)
  workflow_dispatch:        # lets you click "Run workflow" to refresh on demand

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch data and rebuild dashboard
        run: python build_dashboard.py
      - name: Commit updated data and page
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nothing changed"
          git push
